name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine Backend & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Backend
        run: bun run typecheck

      - name: Run Backend Tests
        run: bun test --pass-with-no-tests

  dashboard:
    name: Dashboard UI Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root & dashboard dependencies
        run: |
          bun install --frozen-lockfile
          cd dashboard && bun install --frozen-lockfile

      - name: Build Dashboard
        run: bun run build:dashboard

  website:
    name: Marketing Website Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Build Website
        working-directory: website
        run: bun run build
